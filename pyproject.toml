[tool.uv.build-backend]
module-name = "search_agent"
module-root = "src"

[project]
name = "langchain-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nishant Chaudhary07", email = "nishantchaudhary1204@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
    "tavily>=1.1.0",
]

[project.scripts]
search-agent = "search_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
